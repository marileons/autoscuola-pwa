<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Autoscuola">
  <title>Autoscuola</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="homeView" class="view active">
    <header><h1>Autoscuola</h1></header>
    <div class="tabs">
      <button id="activeTab" class="tab active">Allievi</button>
      <button id="archiveTab" class="tab">Archivio</button>
    </div>
    <div class="content">
      <input id="searchInput" type="search" placeholder="Cerca allievo">
      <div class="new-row">
        <input id="newStudentInput" type="text" placeholder="Nome nuovo allievo">
        <button id="newStudentButton" class="primary">Aggiungi</button>
      </div>
      <div id="studentList"></div>
      <p id="emptyList" class="empty hidden">Nessun allievo.</p>
    </div>
  </section>

  <section id="studentView" class="view">
    <header class="bar">
      <button id="backHome" class="link">‹ Indietro</button>
      <h2 id="studentName"></h2>
      <span></span>
    </header>
    <div class="content">
      <button id="newLessonButton" class="primary">Nuova guida</button>
      <div class="two">
        <button id="archiveButton" class="secondary">Sposta in archivio</button>
        <button id="restoreButton" class="secondary hidden">Ripristina</button>
        <button id="deleteButton" class="danger">Cancella</button>
      </div>

      <section class="card">
        <h3>Checklist</h3>
        <div id="checklistContainer"></div>
      </section>

      <section class="card">
        <h3>Guide</h3>
        <div id="lessonList"></div>
        <p id="emptyLessons" class="empty hidden">Nessuna guida salvata.</p>
      </section>
    </div>
  </section>

  <section id="lessonView" class="view">
    <header class="bar">
      <button id="backStudent" class="link">‹ Indietro</button>
      <h2>Nuova guida</h2>
      <span></span>
    </header>
    <div class="content">
      <label>Note</label>
      <textarea id="lessonNotes" placeholder="Scrivi le note della guida"></textarea>
      <section class="card">
        <h3>GPS</h3>
        <p id="gpsStatus">GPS non attivo</p>
        <button id="gpsButton" class="secondary">Avvia GPS</button>
      </section>
      <button id="saveLessonButton" class="primary">Salva guida</button>
    </div>
  </section>

  <section id="mapView" class="view">
    <header class="bar">
      <button id="backMap" class="link">‹ Indietro</button>
      <h2>Percorso</h2>
      <span></span>
    </header>
    <div id="map"></div>
    <p id="mapNotice" class="notice hidden"></p>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
